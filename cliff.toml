# cliff.toml — git-cliff configuration for macOS release tools
# Generates HTML release notes compatible with Sparkle's update dialog.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = ""
body = """
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<h3>What's new in {{ version }}</h3>
{% set features = commits | filter(attribute="group", value="New Features") -%}
{% set fixes = commits | filter(attribute="group", value="Bug Fixes") -%}
{% if features | length > 0 %}<h4>New Features</h4>
<ul>
{% for commit in features %}  <li>{{ commit.message | trim }}</li>
{% endfor %}</ul>
{% endif -%}
{% if fixes | length > 0 %}<h4>Bug Fixes</h4>
<ul>
{% for commit in fixes %}  <li>{{ commit.message | trim }}</li>
{% endfor %}</ul>
{% endif -%}
{% if features | length == 0 and fixes | length == 0 %}<p>Minor improvements and stability fixes.</p>
{% endif %}
</body>
</html>
"""
footer = ""
trim = true

[bump]
custom_minor_increment_regex = "^feat"

[git]
conventional_commits = true
filter_unconventional = true
# Rewrite merge commits from feature/fix branches into conventional commit format
# so they're picked up by the versioning and changelog logic.
# e.g. "Merge pull request #8 from .../feat/groups-redesign" → "feat: groups-redesign"
commit_preprocessors = [
  { pattern = "^Merge pull request #\\d+ from [^/]+/feat[/-](\\S+).*", replace = "feat: $1" },
  { pattern = "^Merge pull request #\\d+ from [^/]+/fix[/-](\\S+).*", replace = "fix: $1" },
]
commit_parsers = [
  { message = "^feat", group = "New Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = ".*", group = "Maintenance" },
]
filter_commits = true
tag_pattern = "v?[0-9]*"
