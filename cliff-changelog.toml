# cliff-changelog.toml: git-cliff configuration for CHANGELOG.md in the app repo
#
# Produces a Keep a Changelog-style markdown file, regenerated in full from
# the complete tag history on every release (not just appended). This is
# git-cliff's recommended pattern: full regeneration is idempotent and keeps
# the file consistent even if commit history gets rewritten or amended.
#
# Separate from cliff.toml, which renders the HTML snippet used for Sparkle's
# per-release notes (release-notes-link in the appcast). This file renders a
# single running CHANGELOG.md with every version's section.
#
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
"""
body = """
## [{{ version | trim_start_matches(pat="v") }}]{% if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}- {{ commit.message | trim }}
{% endfor %}
{% endfor %}"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { body = ".*BREAKING CHANGE", group = "Breaking Changes" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", skip = true },
  { message = "^docs", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { message = "^ci", skip = true },
  { message = "^build", skip = true },
]
filter_commits = true
tag_pattern = "v?[0-9].*"
